<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TinyMe — little link, big features. Make a link." />
  <meta name="theme-color" content="#0b0b0b" />
  <meta property="og:title" content="TinyMe — Little link. Big features." />
  <meta property="og:description" content="Little link. Big features. Make a link." />
  <meta property="og:image" content="/assets/world/ch-00/plate.webp" />
  <title>TinyMe — Little link. Big features.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="tinyme" data-world-mode="film">
  <a class="skip-link" href="#tm-main">Skip to content</a>

  <header class="site-header world-header tm-simple-header" data-header>
    <a class="tinyme-brand" href="/tinyme" aria-label="TinyMe">
      <img src="/assets/brand/tinyme-gold.webp" alt="" width="30" height="32" />
      <strong>TinyMe</strong>
    </a>
    <a class="header-cta" href="/onboarding">Make a link <span aria-hidden="true">↗</span></a>
  </header>

  <main id="tm-main" class="tm-film-main">
    <!--
      Design (single job):
      1 film. 1 idea. 1 CTA.
      Scroll = scrub the film. No multi-plate world. No SIGNAL. No chapter theater.
    -->
    <div class="tm-film-stage" data-world-stage>
      <video
        class="tm-film-video"
        data-stage-video
        poster="/assets/world/ch-00/plate.webp"
        muted
        playsinline
        preload="auto"
        loop
      >
        <source src="/assets/world/film/tinyme-world.mp4" type="video/mp4" />
      </video>
      <div class="tm-film-veil" aria-hidden="true"></div>
      <div class="tm-film-copy" data-stage-copy>
        <p class="tm-film-kicker mono">TINYME</p>
        <h1 class="tm-film-title">
          Little link.<br />
          <span class="gold">Big features.</span>
        </h1>
        <p class="tm-film-line">Short URL. Swap destinations.</p>
      </div>
      <a class="tm-film-skip mono" href="#exit">Make a link ↓</a>
    </div>

    <!-- Scroll length only exists to scrub the film -->
    <div class="tm-film-track" data-world-track aria-hidden="true"></div>

    <section class="tm-film-exit" id="exit" aria-labelledby="exit-title">
      <img src="/assets/brand/tinyme-gold.webp" alt="" width="48" height="52" />
      <h2 id="exit-title">Make a link.</h2>
      <p>Print once. Change where it opens later.</p>
      <a class="btn btn-gold" href="/onboarding">Make a link <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <footer class="site-footer section-shell tm-simple-foot">
    <div class="footer-bottom mono">
      <span>© 2026 Ordani Studios</span>
      <a href="/">Studio</a>
      <a href="/console?skip=1">Console</a>
    </div>
  </footer>

  <script src="/app.js" defer></script>
  <script src="/world.js" defer></script>
</body>
</html>
